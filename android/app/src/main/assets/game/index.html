<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <title>Candy Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HUD Bar -->
  <div id="hud-bar">
    <div class="hud-left">
      <span class="hud-title">🍬 CANDY MATCH</span>
    </div>
    <div class="hud-right">
      <span class="hud-item lvl-icon">⚡ Lv.<span id="hud-level">1</span></span>
      <span class="hud-item" onclick="if(window.ShopUI){ShopUI.open();ShopUI.showTab('upgrades')}"><span class="lvl-icon">⚡</span></span>
      <span class="hud-item"><span class="coin-icon">🪙</span><span id="hud-coins">100</span></span>
      <span class="hud-item"><span class="gem-icon">💎</span><span id="hud-gems">0</span></span>
    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <div id="game-info">
      <div class="info-box">
        <div class="label">Score</div>
        <div class="value" id="score-value">0</div>
      </div>
      <div class="info-box">
        <div class="label">Moves</div>
        <div class="value" id="moves-value" style="color:var(--accent-blue);">30</div>
      </div>
      <div id="level-display">Lv.1</div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="button-bar">
      <button class="game-btn btn-primary" id="restart-btn">▶ Restart</button>
      <button class="game-btn btn-shop" id="button-shop">🛒 Shop</button>
      <button class="game-btn btn-upgrade" id="button-upgrade">⚡ Upgrade</button>
      <button class="game-btn btn-powerup" id="button-ach">🏆</button>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="game-over-overlay">
    <div class="game-over-box">
      <h2>🍬 Level Complete!</h2>
      <div style="margin:8px 0;font-size:14px;color:var(--text-secondary);">Target: <span id="target-score">500</span></div>
      <div class="final-score" id="final-score">0</div>
      <div id="game-result" style="margin:8px 0;font-size:18px;font-weight:700;color:var(--accent-gold);"></div>
      <div class="btn-group">
        <button class="game-btn btn-primary" id="next-level-btn">▶ Next Level</button>
        <button class="game-btn btn-restart" id="restart-btn2">🔄 Retry</button>
      </div>
    </div>
  </div>

  <!-- Notification -->
  <div id="notification"></div>

  <script src="visuals.js"></script>
  <script src="progression.js"></script>
  <script src="shop.js"></script>
    <script src="ads-manager.js"></script>
  <script src="challenges-system.js"></script>
  <script src="store-rotator.js"></script>
  <script src="retention-system.js"></script>
  <script src="collectibles-system.js"></script>
  <script src="tutorial-system.js"></script>
  <script src="game.js"></script>
</body>
</html>
